<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Quality Background Remover</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .upload-box { border: 2px dashed #4F46E5; padding: 40px; cursor: pointer; border-radius: 10px; margin-bottom: 20px; background: #EEF2FF; }
        .previews { display: flex; gap: 20px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .preview-item { flex: 1; min-width: 300px; border: 1px solid #ddd; padding: 10px; border-radius: 10px; background: url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><rect width="10" height="10" fill="%23ccc"/><rect x="10" width="10" height="10" fill="%23fff"/><rect y="10" width="10" height="10" fill="%23fff"/><rect x="10" y="10" width="10" height="10" fill="%23ccc"/></svg>'); }
        img, canvas { max-width: 100%; height: auto; }
        .controls { background: #f9f9f9; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: left; }
        .btn { background: #4F46E5; color: white; border: none; padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 5px; width: 100%; margin-top: 10px;}
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        #status { font-weight: bold; color: #d97706; margin-bottom: 15px; }
        #error-log { color: red; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Perfect Background Remover</h2>
        
        <div class="upload-box" onclick="document.getElementById('file-input').click()">
            <h3>এখানে ক্লিক করে ছবি আপলোড করুন</h3>
            <input type="file" id="file-input" accept="image/*" style="display: none;">
        </div>

        <div id="status"></div>
        <div id="error-log"></div>

        <div class="controls">
            <label><b>Smooth Edge:</b> <span id="smooth-val">0 px</span> (বর্ডার মসৃণ করতে)</label>
            <input type="range" id="smooth-slider" min="0" max="5" step="0.5" value="0" style="width: 100%;">
            
            <br><br>
            
            <label><b>Edge Defringe:</b> <span id="choke-val">0 px</span> (সাদা আভা দূর করতে)</label>
            <input type="range" id="choke-slider" min="0" max="5" step="0.5" value="0" style="width: 100%;">
        </div>

        <div class="previews">
            <div class="preview-item">
                <p>Original</p>
                <img id="original-img" style="display: none;">
            </div>
            <div class="preview-item">
                <p>Result</p>
                <canvas id="result-canvas" style="display: none;"></canvas>
            </div>
        </div>

        <button id="download-btn" class="btn" disabled>Download Full HD PNG</button>
    </div>

    <!-- ES Module ব্যবহার করে সঠিকভাবে লাইব্রেরি লোড করা হলো -->
    <script type="module">
        import imglyRemoveBackground from 'https://unpkg.com/@imgly/background-removal@1.4.3/dist/background-removal.mjs';

        const fileInput = document.getElementById('file-input');
        const statusDiv = document.getElementById('status');
        const errorLog = document.getElementById('error-log');
        const downloadBtn = document.getElementById('download-btn');
        
        const originalImg = document.getElementById('original-img');
        const resultCanvas = document.getElementById('result-canvas');
        const ctx = resultCanvas.getContext('2d');
        
        const smoothSlider = document.getElementById('smooth-slider');
        const chokeSlider = document.getElementById('choke-slider');
        
        let originalImageObj = new Image();
        let maskImageObj = new Image();
        let isReady = false;

        smoothSlider.addEventListener('input', (e) => {
            document.getElementById('smooth-val').innerText = e.target.value + ' px';
            if(isReady) applyEffects();
        });
        chokeSlider.addEventListener('input', (e) => {
            document.getElementById('choke-val').innerText = e.target.value + ' px';
            if(isReady) applyEffects();
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            isReady = false;
            downloadBtn.disabled = true;
            errorLog.innerText = "";
            originalImg.style.display = 'block';
            resultCanvas.style.display = 'none';
            originalImg.src = URL.createObjectURL(file);
            originalImageObj.src = originalImg.src;

            statusDiv.innerText = "Processing... (Downloading AI model, please wait)";
            statusDiv.style.color = "#d97706";

            try {
                const config = {
                    publicPath: "https://unpkg.com/@imgly/background-removal@1.4.3/dist/",
                    progress: (key, current, total) => {
                        const percent = Math.round((current / total) * 100);
                        statusDiv.innerText = `Downloading AI Model... ${percent}%`;
                    }
                };

                // কল করা হচ্ছে ইমপোর্ট করা ফাংশনটি
                const blob = await imglyRemoveBackground(file, config);
                const maskUrl = URL.createObjectURL(blob);
                
                maskImageObj.onload = () => {
                    isReady = true;
                    statusDiv.innerText = "✅ Background Removed Successfully!";
                    statusDiv.style.color = "green";
                    resultCanvas.style.display = 'block';
                    downloadBtn.disabled = false;
                    applyEffects();
                };
                maskImageObj.src = maskUrl;

            } catch (err) {
                console.error(err);
                statusDiv.innerText = "❌ Processing Failed!";
                statusDiv.style.color = "red";
                errorLog.innerText = "Error: " + err.message;
            }
        });

        function applyEffects() {
            const width = originalImageObj.naturalWidth;
            const height = originalImageObj.naturalHeight;
            resultCanvas.width = width;
            resultCanvas.height = height;

            const smooth = parseFloat(smoothSlider.value);
            const choke = parseFloat(chokeSlider.value);

            ctx.clearRect(0, 0, width, height);

            ctx.filter = smooth > 0 ? `blur(${smooth}px)` : 'none';
            ctx.drawImage(maskImageObj, 0, 0, width, height);
            ctx.filter = 'none';

            ctx.globalCompositeOperation = 'source-in';
            ctx.drawImage(originalImageObj, 0, 0, width, height);
            ctx.globalCompositeOperation = 'source-over';

            if (choke > 0) {
                let imgData = ctx.getImageData(0, 0, width, height);
                let data = imgData.data;
                for (let i = 3; i < data.length; i += 4) {
                    if (data[i] > 0 && data[i] < 255) {
                        data[i] = Math.max(0, data[i] - (choke * 15));
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            }
        }

        downloadBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.download = 'hd-logo-transparent.png';
            a.href = resultCanvas.toDataURL('image/png', 1.0);
            a.click();
        });
    </script>
</body>
</html>
